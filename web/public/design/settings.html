<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SuenMusic · 设置稿</title>
<style>
  /* ==========================================================================
     令牌
     ========================================================================== */
  :root {
    --bg: #0e0f11;
    --panel: #17181b;
    --panel-2: #1d1f23;
    --line: #2a2c30;
    --text: #e9e7e2;
    --dim: #8a8d93;
    --amber: #e8a33d;
    --amber-ink: #1a1206;
    --hi: rgba(255, 255, 255, 0.06);
    --lo: rgba(0, 0, 0, 0.55);
    --r: 10px;
  }
  body.paper {
    --bg: #f2f0ea;
    --panel: #fffdf8;
    --panel-2: #f7f3ea;
    --line: #dcd6c9;
    --text: #141414;
    --dim: #6d6a63;
    --amber: #b0650f;
    --amber-ink: #fff;
    --hi: rgba(255, 255, 255, 0.95);
    --lo: rgba(0, 0, 0, 0.12);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    padding: 28px 20px 60px;
  }

  /* ==========================================================================
     页头
     ========================================================================== */
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 980px;
    margin: 0 auto 26px;
  }
  .brand {
    font-size: 10px;
    letter-spacing: 0.26em;
    color: var(--dim);
  }
  .theme-switch {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .theme-switch button {
    background: transparent;
    border: 0;
    color: var(--dim);
    font: inherit;
    font-size: 10px;
    letter-spacing: 0.16em;
    padding: 7px 11px;
    cursor: pointer;
  }
  .theme-switch button.on {
    color: var(--text);
    background: var(--panel);
    box-shadow: inset 0 1px 0 var(--hi);
  }

  /* ==========================================================================
     画布
     ========================================================================== */
  .frames {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    justify-content: center;
    align-items: flex-start;
    max-width: 980px;
    margin: 0 auto;
  }
  figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  figcaption {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-align: center;
  }
  .phone {
    width: 360px;
    height: 720px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 1px 0 var(--hi);
  }
  .statusbar {
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-size: 10px;
    color: var(--dim);
    flex: none;
  }
  .screen {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 18px 28px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ==========================================================================
     基础件
     ========================================================================== */
  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 8px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--dim);
    font-weight: 500;
  }
  .label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .sec { display: flex; flex-direction: column; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: inset 0 1px 0 var(--hi);
    overflow: hidden;
  }

  .row {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .name { font-size: 14px; }
  .row .val { font-size: 11px; color: var(--dim); }

  .pad {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    box-shadow: inset 0 1px 0 var(--hi);
  }
  .btn:active { transform: translateY(1px); box-shadow: inset 0 2px 7px var(--lo); }
  .btn.primary {
    background: var(--amber);
    border-color: color-mix(in srgb, var(--amber) 70%, #000);
    color: var(--amber-ink);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }
  .btn.danger { color: #d4564a; background: transparent; border: 0; box-shadow: none; height: 28px; padding: 0 4px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  .btn.wide { width: 100%; }

  .input {
    height: 36px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 0 12px;
    box-shadow: inset 0 2px 6px var(--lo);
  }
  .input::placeholder { color: var(--dim); }
  .field { display: flex; align-items: center; gap: 10px; }
  .field .k { width: 54px; flex: none; font-size: 12px; color: var(--dim); }

  .switch {
    width: 44px;
    height: 26px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--amber) 55%, var(--line));
    background: color-mix(in srgb, var(--amber) 18%, var(--panel));
    position: relative;
    flex: none;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 20px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--amber);
    border: 1px solid color-mix(in srgb, var(--amber) 70%, #000);
  }
  .switch.off {
    background: var(--bg);
    border-color: var(--line);
    box-shadow: inset 0 2px 6px var(--lo);
  }
  .switch.off::after {
    left: 2px;
    background: var(--panel);
    border-color: var(--line);
  }

  .seg {
    display: flex;
    gap: 18px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
  }
  .seg button {
    position: relative;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--dim);
    padding: 11px 0 9px;
    cursor: pointer;
  }
  .seg button.on { color: var(--text); }
  .seg button.on::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--amber);
  }

  /* 顶部标签：本机 / 智能 / 高级 */
  .tabs {
    display: flex;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--bg);
    box-shadow: inset 0 2px 7px var(--lo);
  }
  .tabs button {
    flex: 1;
    height: 34px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
    position: relative;
  }
  .tabs button.on {
    background: var(--panel-2);
    color: var(--text);
    box-shadow: inset 0 1px 0 var(--hi);
    font-weight: 500;
  }
  .tabs button.on::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 5px;
    width: 12px;
    height: 2px;
    background: var(--amber);
    transform: translateX(-50%);
  }

  .muted { color: var(--dim); font-size: 11px; }
  .mono { font-variant-numeric: tabular-nums; }

  /* 折叠箭头 */
  .chev {
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--dim);
    border-bottom: 1.5px solid var(--dim);
    transform: rotate(45deg) translateY(-2px);
    transition: transform 0.2s ease;
  }
  .open .chev { transform: rotate(-135deg) translateY(-2px); }

  /* 服务端列表 */
  .server {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 14px;
    min-height: 48px;
  }
  .server + .server { border-top: 1px solid var(--line); }
  .prio { font-size: 10px; color: var(--dim); }
  .sname { font-size: 13px; }
  .surl { font-size: 10px; color: var(--dim); margin-top: 2px; }
  .led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 6px color-mix(in srgb, var(--amber) 60%, transparent);
  }
  .led.off { background: var(--line); box-shadow: none; }

  /* 统计 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat { padding: 12px 14px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .k { font-size: 10px; letter-spacing: 0.12em; color: var(--dim); }
  .stat .v { margin-top: 4px; font-size: 15px; }

  /* 页面内的 AI 分配 */
  .select {
    height: 36px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 0 10px;
  }
</style>
</head>
<body>

<header class="page-head">
  <div class="brand">SUENMUSIC · SETTINGS</div>
  <div class="theme-switch">
    <button class="on" data-theme="dark">DARK</button>
    <button data-theme="paper">PAPER</button>
  </div>
</header>

<main class="frames">
  <!-- ======================================================= 无服务端 -->
  <figure>
    <figcaption>无服务端 · 单页</figcaption>
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>5G ▮</span></div>
      <div class="screen">
        <h1>设置</h1>

        <section class="sec">
          <p class="label">播放</p>
          <div class="panel">
            <div class="row">
              <span class="name">蓝牙歌词</span>
              <span class="switch"></span>
            </div>
            <div class="row">
              <span class="name">缓存</span>
              <span class="val mono">1.2 GB / 4 GB</span>
            </div>
          </div>
        </section>

        <section class="sec">
          <p class="label">资料库</p>
          <div class="panel">
            <div class="row">
              <span class="name">黑名单</span>
              <span class="val">歌曲 3 · 歌手 1</span>
            </div>
            <div class="row">
              <span class="name">歌单导入</span>
              <span class="val">QQ 歌单</span>
            </div>
            <div class="row">
              <span class="name">去重</span>
              <span class="val">发现 5 首</span>
            </div>
            <div class="row">
              <span class="name">数据备份</span>
              <span class="val">WebDAV · 文件</span>
            </div>
          </div>
        </section>

        <section class="sec">
          <p class="label">设备</p>
          <div class="panel">
            <div class="row">
              <span class="name">应用更新</span>
              <span class="val">v1.0 · 最新</span>
            </div>
            <div class="row">
              <span class="name">主题</span>
              <span class="val">跟随系统</span>
            </div>
          </div>
        </section>

        <section class="sec">
          <div class="panel pad">
            <div class="field">
              <span class="k">服务端</span>
              <input class="input" placeholder="http://192.168.1.10:3210" />
            </div>
            <div class="field">
              <span class="k">账号</span>
              <input class="input" placeholder="demo" />
            </div>
            <div class="field">
              <span class="k">口令</span>
              <input class="input" type="password" placeholder="••••••" />
            </div>
            <button class="btn primary wide">登入</button>
          </div>
        </section>
      </div>
    </div>
  </figure>

  <!-- ======================================================= 有服务端 -->
  <figure>
    <figcaption>有服务端 · 本机 / 智能 / 高级</figcaption>
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>5G ▮</span></div>
      <div class="screen">
        <h1>设置</h1>

        <div class="tabs" id="tabs">
          <button class="on" data-tab="local">本机</button>
          <button data-tab="smart">智能</button>
          <button data-tab="advanced">高级</button>
        </div>

        <!-- ---------------- 本机 ---------------- -->
        <div data-pane="local" class="pane">
          <section class="sec">
            <p class="label">播放</p>
            <div class="panel">
              <div class="row">
                <span class="name">蓝牙歌词</span>
                <span class="switch"></span>
              </div>
              <div class="row">
                <span class="name">缓存</span>
                <span class="val mono">1.2 GB / 4 GB</span>
              </div>
            </div>
          </section>

          <section class="sec">
            <p class="label">资料库</p>
            <div class="panel">
              <div class="row">
                <span class="name">黑名单</span>
                <span class="val">歌曲 3 · 歌手 1</span>
              </div>
              <div class="row">
                <span class="name">歌单导入</span>
                <span class="val">QQ 歌单</span>
              </div>
              <div class="row">
                <span class="name">去重</span>
                <span class="val">发现 5 首</span>
              </div>
              <div class="row">
                <span class="name">数据备份</span>
                <span class="val">上次 10-17</span>
              </div>
            </div>
          </section>

          <section class="sec">
            <p class="label">设备</p>
            <div class="panel">
              <div class="row">
                <span class="name">应用更新</span>
                <span class="val">v1.0 · 最新</span>
              </div>
              <div class="row">
                <span class="name">主题</span>
                <span class="val">跟随系统</span>
              </div>
            </div>
          </section>

          <section class="sec">
            <div class="panel">
              <div class="row">
                <span class="name">Demo</span>
                <button class="btn danger">登出</button>
              </div>
            </div>
          </section>
        </div>

        <!-- ---------------- 智能 ---------------- -->
        <div data-pane="smart" class="pane" hidden>
          <section class="sec">
            <p class="label">画像</p>
            <div class="panel">
              <div class="row" style="cursor:pointer">
                <span class="name">音乐画像</span>
                <span class="chev"></span>
              </div>
              <div class="hidden-body" style="display:none">
                <div class="pad">
                  <div style="font-size:13px; line-height:1.7">
                    偏好人声与华语流行，夜晚更常听抒情人声。
                  </div>
                  <div class="muted">华语流行 62% · 人声优先 · 夜间活跃</div>
                </div>
              </div>
            </div>
          </section>

          <section class="sec">
            <p class="label">调优</p>
            <div class="panel pad">
              <input class="input" placeholder="例如：少一点电音" />
              <button class="btn primary wide">提交</button>
            </div>
          </section>

          <section class="sec">
            <p class="label">AI 分配</p>
            <div class="panel pad">
              <div class="field">
                <span class="k">决策</span>
                <select class="select"><option>glm-5.3-flash</option><option>glm-5.3</option></select>
              </div>
              <div class="field">
                <span class="k">复核</span>
                <select class="select"><option>glm-5.3</option><option>glm-5.3-flash</option></select>
              </div>
            </div>
          </section>
        </div>

        <!-- ---------------- 高级 ---------------- -->
        <div data-pane="advanced" class="pane" hidden>
          <section class="sec">
            <p class="label">多服务端</p>
            <div class="panel">
              <div class="server">
                <span class="prio">1</span>
                <div>
                  <div class="sname">内网</div>
                  <div class="surl">http://192.168.1.10:3210</div>
                </div>
                <span class="led"></span>
              </div>
              <div class="server">
                <span class="prio">2</span>
                <div>
                  <div class="sname">公网</div>
                  <div class="surl">https://music.example.com</div>
                </div>
                <span class="led off"></span>
              </div>
            </div>
          </section>

          <section class="sec">
            <p class="label">音源授权</p>
            <div class="panel">
              <div class="row">
                <span class="name">B 站</span>
                <span class="val">已授权 · 阿燊</span>
              </div>
              <div class="row">
                <span class="name">网易云</span>
                <span class="val">未授权</span>
              </div>
            </div>
          </section>

          <section class="sec">
            <p class="label">运行情况</p>
            <div class="panel">
              <div class="stats">
                <div class="stat"><div class="k">注册</div><div class="v">开放</div></div>
                <div class="stat"><div class="k">账号</div><div class="v">1</div></div>
                <div class="stat"><div class="k">口令</div><div class="v">6 位</div></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </figure>
</main>

<script>
  // 主题
  document.querySelectorAll('.theme-switch button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.theme-switch button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      document.body.classList.toggle('paper', btn.dataset.theme === 'paper');
    });
  });

  // 顶部标签
  const tabs = document.getElementById('tabs');
  tabs?.addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('[data-pane]').forEach(p => {
      p.hidden = p.dataset.pane !== b.dataset.tab;
    });
  });

  // 画像折叠
  document.querySelectorAll('.row').forEach(row => {
    if (row.querySelector('.chev')) {
      row.addEventListener('click', () => {
        const body = row.parentElement.querySelector('.hidden-body');
        if (!body) return;
        const open = body.style.display !== 'none';
        body.style.display = open ? 'none' : 'block';
        row.parentElement.classList.toggle('open', !open);
        row.querySelector('.chev')?.classList.toggle('open', !open);
      });
    }
  });
</script>
</body>
</html>
