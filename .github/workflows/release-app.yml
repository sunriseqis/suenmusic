name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（如 v2.0.0，不填则读取 VERSION 文件）'
        required: false
        default: ''

jobs:
  build-fnos:
    name: Build fnOS Package (.fpk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd web && npm ci && cd ..
          cd server && npm ci && cd ..

      - name: Build Web SPA
        run: npm run web:build

      - name: Build fnOS FPK Package
        run: node scripts/build-fn.mjs

      - name: Upload fnOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-package
          path: output/*.fpk
          if-no-files-found: error

  build-harmony:
    name: Build HarmonyOS HAP (.hap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup HarmonyOS / OpenHarmony Toolchain
        uses: ErBWs/setup-ohos@v2
        with:
          version: '6.1.1.280'
          cache: true

      - name: Build HarmonyOS HAP
        run: |
          npm run hw:check
          node scripts/build-hw.mjs

      - name: Upload HarmonyOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-package
          path: output/*.hap
          if-no-files-found: error

  publish-release:
    name: Publish Release to sunriseqis/suenapp
    needs: [build-fnos, build-harmony]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets & Tag
        id: prep
        run: |
          mkdir -p release_dist
          find artifacts -type f \( -name "*.fpk" -o -name "*.hap" \) -exec cp {} release_dist/ \;
          echo "Files to upload:"
          ls -la release_dist/

          # 解析发布版本号
          RAW_VER=$(cat VERSION | tr -d '[:space:]')
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v${RAW_VER}"
            fi
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${RAW_VER}" >> $GITHUB_OUTPUT

      - name: Publish Release to Public Repo (sunriseqis/suenapp)
        uses: softprops/action-gh-release@v2
        with:
          repository: sunriseqis/suenapp
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.SUENAPP_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.prep.outputs.tag }}
          name: SuenMusic ${{ steps.prep.outputs.tag }}
          body: |
            ### SuenMusic ${{ steps.prep.outputs.tag }} 跨端原生安装包发布

            #### 产物说明：
            - **飞牛私有云（fnOS）套件**：`.fpk` 纯原生运行，支持安装向导配置端口与管理员账号。
            - **鸿蒙 NEXT 原生客户端**：`.hap` 未签名安装包，可直接用于模拟器或侧载工具签名安装。

            *由 GitHub Actions 自动化构建直发。*
          files: release_dist/*
          draft: false
          prerelease: false
