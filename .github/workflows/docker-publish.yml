name: 构建推送Docker镜像 (手动)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '镜像标签版本（如 2.0.0，不填则读取 VERSION 文件；默认同时打上 latest）'
        required: false
        default: ''

jobs:
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Tags
        id: meta
        run: |
          RAW_VER=$(cat VERSION | tr -d '[:space:]')
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          VER="${INPUT_TAG:-$RAW_VER}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          TAGS="${IMAGE}:${VER},${IMAGE}:latest"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Building & Pushing tags: ${TAGS}"

      - name: Build and Push All-in-One Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
